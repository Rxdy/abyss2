# Recouvrement de production — utilisé EN PLUS de docker-compose.yml, jamais seul :
#
#   make up-prod
#   # équivalent à :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api frontend
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Ce que ça change par rapport au développement :
#   - rien n'est construit sur le serveur : API et front sont des images publiées sur GHCR par la
#     CI (job « images », après chaque merge sur main), puis tenues à jour par watchtower (label
#     ci-dessous, comme les autres apps du Pi). Un build sur le Pi l'a déjà mis à genoux ;
#   - le front est servi par nginx (bundle statique), plus par le serveur de dev de Vite ;
#   - l'API tourne sans watcher (`npm start`) ni volumes montés — le code vient de l'image ;
#   - chaque conteneur a une limite de mémoire : une app qui dérape est arrêtée seule ;
#   - front et API ne publient plus de port sur l'hôte : seul Traefik les atteint, sur le réseau
#     Docker externe déclaré ci-dessous. C'est lui qui termine le TLS (l'installation de la PWA
#     l'exige hors localhost) et route un seul domaine : /api vers l'API, le reste vers le front —
#     même origine, condition nécessaire au cookie de session httpOnly (voir ARCHITECTURE.md).
#
# Suppose Traefik déjà en place sur ce serveur (routeur dynamique Docker, résolveur de
# certificats configuré) et joignable depuis ce projet via le réseau externe $TRAEFIK_NETWORK.
# Variables à définir dans .env : DOMAIN (nom de domaine public), TRAEFIK_NETWORK (nom du réseau
# Docker de Traefik, "traefik" par défaut), TRAEFIK_CERT_RESOLVER (nom du résolveur de
# certificats configuré côté Traefik, "letsencrypt" par défaut).

services:
  api:
    image: ghcr.io/rxdy/abyss-api:latest
    # `!reset` : supprime le `build` hérité de docker-compose.yml — sans image locale, Compose
    # retomberait sinon sur un build (voir l'en-tête).
    build: !reset null
    pull_policy: missing
    mem_limit: 256m
    # Migrations appliquées au démarrage (CMD de backend/Dockerfile.prod) : plus lent sur le Pi.
    healthcheck:
      start_period: 60s
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://${DOMAIN}
      CHOKIDAR_USEPOLLING: ""
      CHOKIDAR_INTERVAL: ""
    # `!reset` : ces listes existent côté développement (port publié, sources montées en direct) ;
    # sans lui, Compose les FUSIONNE au lieu de les remplacer, et la prod garde les deux.
    ports: !reset []
    volumes: !reset []
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.services.abyss2-api.loadbalancer.server.port=3000
      - traefik.http.routers.abyss2-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.abyss2-api.priority=10
      - traefik.http.routers.abyss2-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.abyss2-api.tls=true
      - traefik.http.routers.abyss2-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
    networks:
      - abyss2_network
      - traefik

  frontend:
    # Construite par la CI (frontend/Dockerfile.prod, VITE_API_URL vide : même origine que l'API
    # derrière Traefik, URL relative) — nom distinct de l'image de développement.
    image: ghcr.io/rxdy/abyss-frontend:latest
    build: !reset null
    pull_policy: missing
    mem_limit: 64m
    # nginx écoute sur 80 — le contrôle de docker-compose.yml vise le serveur Vite (5173).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
    ports: !reset []
    volumes: !reset []
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.services.abyss2-frontend.loadbalancer.server.port=80
      - traefik.http.routers.abyss2-frontend.rule=Host(`${DOMAIN}`)
      # 2, pas 1 : le fallback de l'infra (HostRegexp(`^.+$`), « Parcelle vacante ») est en priorité 1 —
      # à égalité, Traefik choisit au hasard et servait sa page à la place de l'app.
      - traefik.http.routers.abyss2-frontend.priority=2
      - traefik.http.routers.abyss2-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.abyss2-frontend.tls=true
      - traefik.http.routers.abyss2-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
    networks:
      - abyss2_network
      - traefik

  # Jamais sur le réseau Traefik : seuls front et API doivent être joignables depuis l'extérieur.
  postgres:
    mem_limit: 256m
    ports: !reset []

  # Mailpit ne sert qu'à intercepter les emails en développement (voir docker-compose.yml) : lui
  # donner un profil qu'aucune commande ne demande ici l'exclut de `make up-prod`. La production
  # parle à un vrai relais SMTP via les variables SMTP_* (voir .env.example) — l'API ne sait pas
  # lequel des deux elle utilise, seule la configuration change.
  mailpit:
    profiles: ["dev-tools"]

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
