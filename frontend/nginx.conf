# Sert le build de production de la PWA. Assume qu'un reverse proxy (Traefik) est devant :
# lui seul termine le TLS et ajoute les en-têtes de sécurité liés à HTTPS (HSTS...) —
# ce fichier ne s'occupe que du contenu et du cache.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA : toute route inconnue retombe sur index.html (le routeur Vue prend le relais).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html et le service worker doivent toujours être revalidés : sans ça, une mise à
  # jour de l'app resterait invisible (voir UpdateBanner côté front, qui prévient une fois
  # la nouvelle version repérée — encore faut-il que le navigateur aille la chercher).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # Fichiers versionnés par Vite (hash dans le nom) : mise en cache longue, sans risque.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # En-têtes de base ; contrairement à l'API (CSP stricte, JSON seulement — voir app.ts),
  # ce serveur sert du HTML/JS/CSS, qui a besoin d'un minimum de latitude.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
