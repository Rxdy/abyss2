name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  NODE_VERSION: '20'

jobs:
  backend-unit:
    name: Backend — tests unitaires (Prisma mocké)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Dépendances d'exécution seulement : les alertes des outils de test sont suivies à part.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          MASTER_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_SECRET: ci-test-jwt-secret

  backend-db:
    name: Backend — tests d'intégration (PostgreSQL réel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: abyss2_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: abyss2_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abyss2_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Appliquer les migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://abyss2_user:ci_password@localhost:5432/abyss2_db?schema=dbo

      - run: npx prisma generate
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://abyss2_user:ci_password@localhost:5432/abyss2_db?schema=dbo
          MASTER_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_SECRET: ci-test-jwt-secret

  frontend:
    name: Frontend — tests unitaires + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── Déploiement continu ────────────────────────────────────
  # Après un merge sur main, et seulement si tous les tests passent : rejoint le tailnet avec un
  # nœud Tailscale éphémère (tag:ci), puis se connecte en SSH à meliodas pour y placer le dépôt sur
  # CE commit (celui qui vient d'être testé, pas « le dernier de main ») et lancer
  # scripts/deploy.sh. Mise en place unique : README, section « Déploiement continu ».
  deploy:
    name: Déploiement — meliodas (via Tailscale)
    needs: [backend-unit, backend-db, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets rangés dans l'environnement « production » : invisibles des autres branches, et
    # possibilité d'exiger une approbation manuelle (Settings → Environments → production).
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    # Un déploiement à la fois, jamais interrompu : deux merges rapprochés se suivent.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'meliodas' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/abyss2' }}
    steps:
      - name: Rejoindre le tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Préparer SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Empreinte du serveur fixée d'avance : on ne fait pas confiance au premier venu qui répond.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Déployer
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          git fetch --quiet origin main
          git reset --hard "$2"
          ./scripts/deploy.sh
          SCRIPT

      - name: Vérifier depuis l'extérieur
        if: vars.PUBLIC_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/health"
