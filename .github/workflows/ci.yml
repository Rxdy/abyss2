name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  NODE_VERSION: '20'

jobs:
  backend-unit:
    name: Backend — tests unitaires (Prisma mocké)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Dépendances d'exécution seulement : les alertes des outils de test sont suivies à part.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          MASTER_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_SECRET: ci-test-jwt-secret

  backend-db:
    name: Backend — tests d'intégration (PostgreSQL réel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: abyss2_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: abyss2_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abyss2_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Appliquer les migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://abyss2_user:ci_password@localhost:5432/abyss2_db?schema=dbo

      - run: npx prisma generate
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://abyss2_user:ci_password@localhost:5432/abyss2_db?schema=dbo
          MASTER_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_SECRET: ci-test-jwt-secret

  frontend:
    name: Frontend — tests unitaires + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── Images de production ───────────────────────────────────
  # Après un merge sur main, et seulement si tous les tests passent : construit les images de l'API
  # et du front pour le Raspberry Pi (arm64, sur un runner ARM natif — pas d'émulation) et les
  # publie sur GHCR. Watchtower, sur le Pi, les installe dans les 5 minutes (label
  # com.centurylinklabs.watchtower.enable, voir docker-compose.prod.yml). Rien n'est jamais
  # construit sur le serveur. Mise en place unique : README, section « Déploiement continu ».
  images:
    name: Images — GHCR (arm64)
    needs: [backend-unit, backend-db, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Une publication à la fois : deux merges rapprochés se suivent, le dernier gagne.
    concurrency:
      group: images-main
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: abyss-api
            context: backend
          - image: abyss-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          platforms: linux/arm64
          push: true
          # :latest pour watchtower, :<sha> pour savoir ce qui tourne et pouvoir revenir en arrière.
          tags: |
            ghcr.io/rxdy/${{ matrix.image }}:latest
            ghcr.io/rxdy/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Front : même origine que l'API derrière Traefik, URL relative (voir Dockerfile.prod).
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
